<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لعبة التعرف على أدوات المركز</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d2a33;--card:#fff;--ac:#0f766e;--mut:#6b7780;--bd:#d9d4c8;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--fg:#eef2f0;--card:#1e2d2c;--ac:#5eead4;--mut:#9fb0ad;--bd:#34504d;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#14201f;--fg:#eef2f0;--card:#1e2d2c;--ac:#5eead4;--mut:#9fb0ad;--bd:#34504d;--ok:#4ade80;--no:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:24px;color:var(--ac);margin:.3em 0}h3{margin:.2em 0 .4em;font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
.o{display:block;width:100%;text-align:start;margin:5px 0}
.o.s{border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.o.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.o.no{border:2px solid var(--no);background:color-mix(in srgb,var(--no) 20%,var(--card))}
.pr{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700;padding:10px 20px}
.big{display:block;width:100%;margin:8px 0;text-align:start}.pr:disabled{opacity:.4;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.im{background:#fff;border-radius:10px;display:flex;justify-content:center;padding:8px}.im img{max-height:200px;max-width:100%;object-fit:contain}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.fb{margin:8px 0;font-size:15px}.r{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding:5px 0;font-size:14px}
</style></head><body><main id="m"></main>

const POOLS={a1:D.slice(0,21),a2:D.slice(21)};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const M=document.getElementById('m');
const KS=[['n','ما اسم الجهاز؟'],['p','أين مكانه في المركز؟'],['f','ما وظيفته؟']];
let mode,Q,i,score,answered,res;
function opts(pool,d,k){const pl=[...new Set(pool.filter(x=>x!==d&&x[k]!==d[k]).map(x=>x[k]))];return sh([d[k],...sh(pl).slice(0,3)])}
function menu(){M.innerHTML=`<h1>لعبة التعرف على أدوات المركز</h1><div class="c"><p>اختر النشاط. تُسحب 3 أجهزة عشوائية، ويظهر سؤال واحد في كل مرة (الاسم، ثم المكان، ثم الوظيفة)، وتظهر النتيجة والإجابات الصحيحة في النهاية فقط.</p><button class="pr big" onclick="start('a1')">تجهيزات غرفة الفحص وأخذ القياسات وصالة التدريب (نشاط 1)</button><button class="pr big" onclick="start('a2')">أجهزة الورش (نشاط 2)</button></div>`}
function start(m){mode=m;const pool=POOLS[m];Q=[];res=[];sh(pool).slice(0,3).forEach(d=>{const r={d,pts:0};res.push(r);KS.forEach(([k,t])=>Q.push({r,d,k,t,o:opts(pool,d,k)}))});i=0;score=0;show()}
function show(){const q=Q[i];
M.innerHTML=`<div class="top"><span>السؤال ${i+1} / ${Q.length}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="c im" style="margin-top:10px"><img src="${q.d.i}" alt="صورة الجهاز"></div><div class="c"><h3>${q.t}</h3>${q.o.map((o,j)=>`<button class="o${q.sel===j?' s':''}" onclick="pick(${j})">${o}</button>`).join('')}</div><button class="pr" id="go" ${q.sel===undefined?'disabled':''} onclick="nx()">${i<Q.length-1?'التالي ‹':'إنهاء وعرض النتيجة'}</button>`}
function pick(j){Q[i].sel=j;show()}
function nx(){i++;i<Q.length?show():end()}
function end(){score=0;Q.forEach(q=>{q.ok=q.o[q.sel]==q.d[q.k];if(q.ok){score++;q.r.pts++}});
M.innerHTML=`<h1>النتيجة: ${score} / ${Q.length}</h1><div class="c">${score==9?'أداء رائع!':score>=6?'جيد، راجع الأخطاء أدناه.':'تحتاج مراجعة الأساس النظري ثم أعد المحاولة.'}</div><h3>مراجعة الإجابات</h3>`+res.map(r=>`<div class="c"><div class="im" style="margin-bottom:8px"><img src="${r.d.i}" style="max-height:110px"></div><div class="r"><b>${r.d.n} (${r.d.en})</b><b>${r.pts}/3</b></div>`+Q.filter(q=>q.r==r).map(q=>`<div class="r" style="display:block"><small>${q.t}</small><br>${q.ok?'<span style="color:var(--ok)">✔ '+q.d[q.k]+'</span>':'<span style="color:var(--no)">✘ إجابتك: '+q.o[q.sel]+'</span><br><span style="color:var(--ok)">✔ الصحيح: '+q.d[q.k]+'</span>'}</div>`).join('')+'</div>').join('')+`<button class="pr" onclick="start('${mode}')">جولة جديدة</button> <button onclick="menu()">القائمة الرئيسية</button>`}
menu();
</script></body></html>
